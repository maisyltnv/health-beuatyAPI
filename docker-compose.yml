services:
  db:
    image: postgres:16-alpine
    container_name: shopapi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopapi
    ports:
      - "5432:5432"
    volumes:
      - shopapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopapi"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopapi-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/shopapi?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-secret}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}
    depends_on:
      db:
        condition: service_healthy

volumes:
  shopapi_pgdata:
