name: health-and-beauty-api

services:
  db:
    image: postgres:16-alpine
    container_name: health-and-beauty-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_and_beauty
    ports:
      - "5432:5432"
    volumes:
      - health_and_beauty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_and_beauty"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-and-beauty-api
    image: health-and-beauty-api:latest
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/health_and_beauty?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-secret}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}
      SHIPPING_FEE_LAK: ${SHIPPING_FEE_LAK:-30000}
      FREE_SHIPPING_MIN_SUBTOTAL_LAK: ${FREE_SHIPPING_MIN_SUBTOTAL_LAK:-500000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  health_and_beauty_pgdata: